name: Release Artifacts
run-name: >-
  Release ${{ inputs.version || 'configured version' }} |
  ${{ inputs.signed_checksums_sha256 != '' && 'signed publication' || 'validation only' }} |
  ${{ github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0). Leave empty to use csproj version."
        required: false
        type: string
      signed_checksums_sha256:
        description: "SHA256 of the approved signed draft's SHA256SUMS.txt. Empty runs validation only."
        required: false
        type: string
jobs:
  resolve-release-version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      baseline-version: ${{ steps.version.outputs.baseline-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve and validate release version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          [xml]$versionProps = Get-Content ".\Version.props" -Raw
          $configuredVersion = [string]($versionProps.Project.PropertyGroup.AudioPilotVersion | Select-Object -First 1)
          $requestedVersion = $env:RELEASE_VERSION_INPUT
          if ([string]::IsNullOrWhiteSpace($requestedVersion) -and $env:RELEASE_REF_TYPE -eq "tag") {
            $requestedVersion = $env:RELEASE_REF_NAME.TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($requestedVersion)) {
            $requestedVersion = $configuredVersion
          }
          if ($requestedVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release version must use numeric SemVer core format (for example, 1.2.3)."
          }
          if ($configuredVersion -ne $requestedVersion) {
            throw "Requested release version '$requestedVersion' does not match Version.props '$configuredVersion'. Update Version.props before releasing so source metadata and artifacts cannot diverge."
          }
          $baselineVersion = "0.9.0"
          if ($baselineVersion -eq $requestedVersion) {
            throw "Baseline MSI version must differ from the release version."
          }
          "baseline-version=$baselineVersion" >> $env:GITHUB_OUTPUT
          "version=$requestedVersion" >> $env:GITHUB_OUTPUT

      - name: Reject replacement of a published application version
        if: github.ref_type == 'tag' || inputs.signed_checksums_sha256 != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          . ./scripts/lib/GitHubRelease.ps1
          $null = Assert-AudioPilotReleaseMutable -Repository $env:RELEASE_REPOSITORY -Version $env:RELEASE_VERSION

  verify-signed-release:
    needs: resolve-release-version
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # GitHub exposes draft releases only to tokens with push access.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validation-only run
        if: inputs.signed_checksums_sha256 == ''
        run: echo "Unsigned build outputs are validation artifacts. Public downloads require an explicitly approved signed draft."
      - name: Setup trusted verifier build
        if: inputs.signed_checksums_sha256 != ''
        uses: ./.github/actions/setup-dotnet-solution
      - name: Setup stable feed verifier
        if: inputs.signed_checksums_sha256 != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: AudioPilot.Updater/TufBridge/.go-version
          cache-dependency-path: AudioPilot.Updater/TufBridge/go.sum
      - name: Download and verify the final signed packages
        if: inputs.signed_checksums_sha256 != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
          SIGNED_CHECKSUMS: ${{ inputs.signed_checksums_sha256 }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/download-signed-release.ps1 -Version $env:RELEASE_VERSION -Repository $env:RELEASE_REPOSITORY -ChecksumsSha256 $env:SIGNED_CHECKSUMS -ExpectedCommit $env:RELEASE_COMMIT
          dotnet build AudioPilot.Updater/Ui/AudioPilot.Updater.Ui.csproj -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Trusted signature verifier build failed.' }
          $verifier = Join-Path $PWD 'AudioPilot.Updater/Ui/bin/Release/net11.0-windows10.0.19041.0/AudioPilot.Updater.exe'
          ./scripts/validate-release-integrity.ps1 -ReleaseRoot artifacts/signed-release -ExpectedCommit $env:RELEASE_COMMIT -RequireSignedBootstrap -PublisherVerifier $verifier
          python -m pip install --disable-pip-version-check -r .github/quality/sbom-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned validators.' }
          python scripts/validate-release-schemas.py --sbom "artifacts/signed-release/AudioPilot-$env:RELEASE_VERSION-sbom.spdx.json" --winget artifacts/signed-release/winget
          if ($LASTEXITCODE -ne 0) { throw 'Final signed metadata schema validation failed.' }
      - name: Verify stable feed matches all final signed variants
        if: inputs.signed_checksums_sha256 != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Push-Location AudioPilot.Updater/TufBridge
          try {
            go build -mod=readonly -trimpath -o ../../artifacts/stable-feed-verifier.exe ./cmd/staging-publisher
            if ($LASTEXITCODE -ne 0) { throw 'Stable feed verifier build failed.' }
          } finally { Pop-Location }
          ./scripts/validate-stable-release.ps1 -ReleaseRoot artifacts/signed-release -Publisher artifacts/stable-feed-verifier.exe -OutputDirectory artifacts/stable-feed-check
      - name: Retain stable feed verification evidence
        if: inputs.signed_checksums_sha256 != '' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-release-verification
          path: |
            artifacts/stable-feed-check/health.json
            artifacts/stable-feed-check/release-verification.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain verified signed packages
        if: inputs.signed_checksums_sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-signed-release
          path: artifacts/signed-release
          compression-level: 0
          if-no-files-found: error
      - name: Retain signed x64 installer for native scenarios
        if: inputs.signed_checksums_sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-signed-installer-x64
          path: artifacts/signed-release/*-x64.msi
          compression-level: 0
          if-no-files-found: error
      - name: Retain signed x86 installer for native scenarios
        if: inputs.signed_checksums_sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-signed-installer-x86
          path: artifacts/signed-release/*-x86.msi
          compression-level: 0
          if-no-files-found: error
      - name: Retain signed ARM64 installer for native scenarios
        if: inputs.signed_checksums_sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-signed-installer-arm64
          path: artifacts/signed-release/*-arm64.msi
          compression-level: 0
          if-no-files-found: error

  release-gate-unit-tests:
    needs: resolve-release-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: X64
          - runner: windows-11-arm
            architecture: Arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      AUDIOPILOT_TEST_ARCHITECTURE: ${{ matrix.architecture }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET Solution
        uses: ./.github/actions/setup-dotnet-solution
        with:
          configuration: Release
          build: true

      - name: Release gate tests (unit)
        shell: pwsh
        run: ./scripts/run-tests.ps1 -Category unit -Configuration Release -NoBuild -NoRestore

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-testresults-unit-${{ matrix.architecture }}-${{ github.run_id }}
          path: artifacts/testresults/unit
          if-no-files-found: ignore
          retention-days: 14

  release-gate-integration-tests:
    needs: resolve-release-version
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET Solution
        uses: ./.github/actions/setup-dotnet-solution
        with:
          configuration: Release
          build: true

      - name: Release gate tests (integration)
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          AUDIOPILOT_TEST_OUTPUT_DEVICE_A: ${{ secrets.AUDIOPILOT_TEST_OUTPUT_DEVICE_A }}
          AUDIOPILOT_TEST_OUTPUT_DEVICE_B: ${{ secrets.AUDIOPILOT_TEST_OUTPUT_DEVICE_B }}
          AUDIOPILOT_TEST_INPUT_DEVICE_A: ${{ secrets.AUDIOPILOT_TEST_INPUT_DEVICE_A }}
          AUDIOPILOT_TEST_INPUT_DEVICE_B: ${{ secrets.AUDIOPILOT_TEST_INPUT_DEVICE_B }}
        run: |
          $isTagRelease = $env:RELEASE_REF_TYPE -eq "tag"
          $isSelfHostedRunner = $env:RUNNER_ENVIRONMENT -eq "self-hosted"
          $env:AUDIOPILOT_REQUIRE_INTEGRATION_HARDWARE = if ($isSelfHostedRunner) { "1" } else { "0" }

          $required = @(
            "AUDIOPILOT_TEST_OUTPUT_DEVICE_A",
            "AUDIOPILOT_TEST_OUTPUT_DEVICE_B",
            "AUDIOPILOT_TEST_INPUT_DEVICE_A",
            "AUDIOPILOT_TEST_INPUT_DEVICE_B"
          )

          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }

          if ($missing.Count -eq 0) {
            try {
              ./scripts/validate-release-hardware.ps1 -Configuration Release -NoBuild -Strict:$isSelfHostedRunner
              if ($isSelfHostedRunner) {
                Write-Host "Hardware integration gate enabled with strict enforcement on self-hosted runner."
              }
              else {
                Write-Host "Hardware integration checks enabled after device-id preflight validation."
              }
            }
            catch {
              if ($isSelfHostedRunner) {
                throw
              }

              Write-Host "::warning::Hardware-specific integration tests will dynamically skip because device-id preflight failed: $($_.Exception.Message)"
            }
          }
          else {
            if ($isTagRelease) {
                Write-Host "::warning::Hardware-specific integration tests will dynamically skip for this tag release because no self-hosted hardware runner is configured (missing secrets: $($missing -join ', ')). Tests that only need a default endpoint can still run."
            }
            else {
              Write-Host "::warning::Hardware-specific integration tests will dynamically skip (missing secrets: $($missing -join ', ')). Configure these secrets on a hardware-capable runner to enable the full integration gate."
            }
          }

          ./scripts/run-tests.ps1 -Category integration -AllowHardwareAudio -Configuration Release -NoBuild -NoRestore

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-testresults-integration-${{ github.run_id }}
          path: artifacts/testresults/integration
          if-no-files-found: ignore
          retention-days: 14

  release-gate-stress-tests:
    needs: resolve-release-version
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET Solution
        uses: ./.github/actions/setup-dotnet-solution
        with:
          configuration: Release
          build: true

      - name: Release gate tests (stress)
        shell: pwsh
        run: ./scripts/run-tests.ps1 -Category stress -Configuration Release -NoBuild -NoRestore

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-testresults-stress-${{ github.run_id }}
          path: artifacts/testresults/stress
          if-no-files-found: ignore
          retention-days: 14

  publish-profiles:
    needs: resolve-release-version
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: FrameworkDependent-win-arm64
          - profile: FrameworkDependent-win-x64
          - profile: FrameworkDependent-win-x86

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props
            global.json

      - name: Publish release profile
        shell: pwsh
        env:
          PUBLISH_PROFILE: ${{ matrix.profile }}
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
        run: |
          $profile = $env:PUBLISH_PROFILE
          ./scripts/publish-release-profiles.ps1 -TargetProfile $profile -Configuration Release -Version $env:RELEASE_VERSION -PayloadOnly

      - name: Test framework-dependent payload validation
        if: startsWith(matrix.profile, 'FrameworkDependent-')
        shell: pwsh
        env:
          PUBLISH_PROFILE: ${{ matrix.profile }}
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
        run: |
          $mode, $rid = $env:PUBLISH_PROFILE -split '-', 2
          ./scripts/tests/test-publish-payload.ps1 -PublishDir "artifacts/publish/$mode/$rid" -RuntimeIdentifier $rid -DeploymentMode $mode -Version $env:RELEASE_VERSION

      - name: Upload published profile output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ matrix.profile }}
          path: artifacts/publish
          if-no-files-found: error

  build-upgrade-baselines:
    needs: resolve-release-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          - platform: x86
            runner: windows-latest
          - platform: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET Solution
        uses: ./.github/actions/setup-dotnet-solution
        with:
          configuration: Release
          restore-project: AudioPilot.Installer/AudioPilot.Installer.wixproj
          package-cache-scope: ${{ matrix.platform == 'x64' && 'msi-x64' || '' }}

      - name: Build synthetic upgrade baseline
        shell: pwsh
        env:
          MSI_PLATFORM: ${{ matrix.platform }}
          MSI_BASELINE_VERSION: ${{ needs.resolve-release-version.outputs.baseline-version }}
        run: |
          $platform = $env:MSI_PLATFORM
          $baselineVersion = $env:MSI_BASELINE_VERSION
          # Only this temporary upgrade baseline skips cabinet compression.
          dotnet build ".\AudioPilot.Installer\AudioPilot.Installer.wixproj" -c Release -p:Platform=$platform -p:DefaultCompressionLevel=none -p:AppVersion=$baselineVersion -p:Version=$baselineVersion -p:AssemblyVersion="$baselineVersion.0" -p:FileVersion="$baselineVersion.0" -p:InformationalVersion=$baselineVersion --no-restore --nologo -clp:PerformanceSummary
          if ($LASTEXITCODE -ne 0) {
            throw "Baseline MSI build failed for version $baselineVersion"
          }

      - name: Test native installer safety policies
        shell: pwsh
        env:
          MSI_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/build-installer-custom-actions.ps1 -Platform $env:MSI_PLATFORM -OutputPath "artifacts/native-policy/$env:MSI_PLATFORM/AudioPilot.Installer.Actions.dll" -RunPolicyTests

      - name: Upload upgrade baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-baseline-${{ matrix.platform }}
          path: AudioPilot.Installer/bin/${{ matrix.platform }}/Release/AudioPilot-${{ needs.resolve-release-version.outputs.baseline-version }}-${{ matrix.platform }}.msi
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  build-msi-installers:
    needs: resolve-release-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
            runSmoke: true
          - platform: x86
            runner: windows-latest
            runSmoke: true
          - platform: arm64
            runner: windows-11-arm
            runSmoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET Solution
        uses: ./.github/actions/setup-dotnet-solution
        with:
          configuration: Release
          restore-project: AudioPilot.Installer/AudioPilot.Installer.wixproj
          package-cache-scope: ${{ matrix.platform == 'x64' && 'msi-x64' || '' }}

      - name: Publish matching self-contained profile
        shell: pwsh
        env:
          PUBLISH_PROFILE: SelfContained-win-${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
        run: |
          $profile = $env:PUBLISH_PROFILE
          ./scripts/publish-release-profiles.ps1 -TargetProfile $profile -Configuration Release -Version $env:RELEASE_VERSION -PayloadOnly

      - name: Build MSI installer
        shell: pwsh
        env:
          MSI_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
        run: |
          $platform = $env:MSI_PLATFORM
          $version = $env:RELEASE_VERSION
          $payload = Join-Path $PWD "artifacts/publish/SelfContained/win-$platform"
          Write-Host "=== Building MSI: $platform ==="
          dotnet build ".\AudioPilot.Installer\AudioPilot.Installer.wixproj" -c Release -p:Platform=$platform -p:UsePrebuiltPublish=true "-p:PublishDirForMsi=$payload" -p:AppVersion=$version -p:Version=$version -p:AssemblyVersion="$version.0" -p:FileVersion="$version.0" -p:InformationalVersion=$version --no-restore --nologo -clp:PerformanceSummary
          if ($LASTEXITCODE -ne 0) {
            throw "MSI build failed for platform $platform"
          }

      - name: Validate MSI option initialization
        if: matrix.runSmoke
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
          MSI_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/tests/test-msi-helpers.ps1 -InstallerPath "AudioPilot.Installer/bin/$env:MSI_PLATFORM/Release/AudioPilot-$env:RELEASE_VERSION-$env:MSI_PLATFORM.msi"

      - name: Test publish payload validation
        shell: pwsh
        env:
          MSI_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
        run: ./scripts/tests/test-publish-payload.ps1 -PublishDir "artifacts/publish/SelfContained/win-$env:MSI_PLATFORM" -RuntimeIdentifier "win-$env:MSI_PLATFORM" -Version $env:RELEASE_VERSION

      - name: Upload published profile output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-SelfContained-win-${{ matrix.platform }}
          path: artifacts/publish
          if-no-files-found: error

      - name: Upload MSI outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: AudioPilot.Installer/bin/${{ matrix.platform }}/Release/*.msi
          compression-level: 0
          if-no-files-found: error

  test-msi-installers:
    needs:
      - resolve-release-version
      - build-msi-installers
      - build-upgrade-baselines
      - verify-signed-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
            runSmoke: true
          - platform: x86
            runner: windows-latest
            runSmoke: true
          - platform: arm64
            runner: windows-11-arm
            runSmoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: AudioPilot.Installer/bin/${{ matrix.platform }}/Release

      - name: Download upgrade baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upgrade-baseline-${{ matrix.platform }}
          path: AudioPilot.Installer/bin/${{ matrix.platform }}/Release

      - name: Download final signed installer inputs
        if: inputs.signed_checksums_sha256 != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-signed-installer-${{ matrix.platform }}
          path: AudioPilot.Installer/bin/${{ matrix.platform }}/Release

      - name: Smoke test MSI install and upgrade
        if: matrix.runSmoke
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ needs.resolve-release-version.outputs.version }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MSI_PLATFORM: ${{ matrix.platform }}
          MSI_BASELINE_VERSION: ${{ needs.resolve-release-version.outputs.baseline-version }}
        run: |
          $versionInput = $env:RELEASE_VERSION_INPUT
          $platform = $env:MSI_PLATFORM
          if ([string]::IsNullOrWhiteSpace($versionInput)) {
            if ($env:RELEASE_REF_TYPE -eq "tag") {
              $versionInput = $env:RELEASE_REF_NAME.TrimStart('v')
            }
            else {
              [xml]$versionProps = Get-Content ".\Version.props" -Raw
              $versionInput = $versionProps.Project.PropertyGroup.AudioPilotVersion | Select-Object -First 1
            }
          }

          if ([string]::IsNullOrWhiteSpace($versionInput)) {
            throw "Unable to resolve release version for MSI smoke test."
          }

          if ($versionInput -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "MSI release version must use numeric SemVer core format (for example, 1.2.3)."
          }

          $baselineVersion = $env:MSI_BASELINE_VERSION
          if ($baselineVersion -eq $versionInput) {
            throw "Baseline MSI version must differ from the release version."
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "audio-pilot-msi-smoke"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null

          $releaseMsiPath = ".\AudioPilot.Installer\bin\$platform\Release\AudioPilot-$versionInput-$platform.msi"
          $preservedReleaseMsiPath = Join-Path $smokeRoot "AudioPilot-$versionInput-$platform.msi"
          Copy-Item -LiteralPath $releaseMsiPath -Destination $preservedReleaseMsiPath -Force

          ./scripts/test-msi-smoke.ps1 `
            -InstallMsiPath $preservedReleaseMsiPath `
            -UpgradeFromMsiPath ".\AudioPilot.Installer\bin\$platform\Release\AudioPilot-$baselineVersion-$platform.msi" `
            -ExpectedVersion $versionInput `
            -InstallRoot (Join-Path $smokeRoot "install root with spaces") `
            -DataRoot (Join-Path $smokeRoot "data root with spaces") `
            -DesktopShortcut 0 `
            -StartMenuShortcut 0 `
            -AddCliToPath 1 `
            -LogName synthetic-upgrade `
            -VerifyUpgradeRollback

          $previousReleaseMsi = $null
          try {
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $releases = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:RELEASE_REPOSITORY/releases?per_page=30")
            $currentVersion = [Version]$versionInput
            $previousRelease = $releases |
              Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v?\d+\.\d+\.\d+$' } |
              ForEach-Object {
                $candidateVersion = [Version]$_.tag_name.TrimStart('v')
                if ($candidateVersion -lt $currentVersion) {
                  [pscustomobject]@{ Release = $_; Version = $candidateVersion }
                }
              } |
              Sort-Object Version -Descending |
              Select-Object -First 1

            if ($previousRelease) {
              $assetName = "AudioPilot-$($previousRelease.Version)-$platform.msi"
              $asset = $previousRelease.Release.assets | Where-Object name -eq $assetName | Select-Object -First 1
              if ($asset) {
                $previousReleaseMsi = Join-Path $smokeRoot $assetName
                $downloadHeaders = $headers.Clone()
                $downloadHeaders.Accept = "application/octet-stream"
                Invoke-WebRequest -Headers $downloadHeaders -Uri $asset.url -OutFile $previousReleaseMsi
                Write-Host "Downloaded previous published MSI for real upgrade smoke: $assetName"
              }
              else {
                Write-Host "::notice::Previous release $($previousRelease.Version) has no matching MSI asset; synthetic upgrade smoke remains authoritative."
              }
            }
          }
          catch {
            Write-Host "::warning::Could not discover or download a previous release MSI: $($_.Exception.Message)"
          }

          if ($previousReleaseMsi) {
            ./scripts/test-msi-smoke.ps1 `
              -InstallMsiPath $preservedReleaseMsiPath `
              -UpgradeFromMsiPath $previousReleaseMsi `
              -ExpectedVersion $versionInput `
              -InstallRoot (Join-Path $smokeRoot "published-upgrade-install-root") `
              -DataRoot (Join-Path $env:APPDATA "AudioPilot") `
              -LogName published-upgrade
          }

          ./scripts/test-msi-option-matrix.ps1 `
            -InstallMsiPath $preservedReleaseMsiPath `
            -ExpectedVersion $versionInput `
            -TestRoot (Join-Path $smokeRoot "option-matrix")

          Copy-Item -LiteralPath $preservedReleaseMsiPath -Destination $releaseMsiPath -Force
          Remove-Item -LiteralPath ".\AudioPilot.Installer\bin\$platform\Release\AudioPilot-$baselineVersion-$platform.msi" -Force -ErrorAction SilentlyContinue

      - name: Upload MSI smoke logs
        if: always() && matrix.runSmoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-smoke-logs-${{ matrix.platform }}
          path: |
            artifacts/msi-smoke
            !artifacts/msi-smoke/**/*.msi
          if-no-files-found: warn

      - name: Upload full MSI smoke diagnostics on failure or cancellation
        if: (failure() || cancelled()) && matrix.runSmoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-smoke-diagnostics-${{ matrix.platform }}
          path: artifacts/msi-smoke
          if-no-files-found: warn

  prepare-packages:
    needs:
      - resolve-release-version
      - publish-profiles
      - build-msi-installers
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download published profile outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: publish-*
          path: artifacts/publish
          merge-multiple: true

      - name: Download x86 MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-x86
          path: AudioPilot.Installer/bin/x86/Release

      - name: Download x64 MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-x64
          path: AudioPilot.Installer/bin/x64/Release

      - name: Download ARM64 MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-arm64
          path: AudioPilot.Installer/bin/arm64/Release

      - name: Package and validate release outputs
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ needs.resolve-release-version.outputs.version }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $versionInput = $env:RELEASE_VERSION_INPUT
          $repository = $env:RELEASE_REPOSITORY
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "Release repository has an invalid owner/name format."
          }

          if ([string]::IsNullOrWhiteSpace($versionInput)) {
            if ($env:RELEASE_REF_TYPE -eq "tag") {
              $tagVersion = $env:RELEASE_REF_NAME.TrimStart('v')
              if ($tagVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
                throw "Release tag must use numeric SemVer core format (for example, v1.2.3)."
              }

              ./scripts/package-release.ps1 -Version $tagVersion -Repository $repository -Clean
            }
            else {
              ./scripts/package-release.ps1 -Repository $repository -Clean
            }
          }
          else {
            if ($versionInput -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Release version must use numeric SemVer core format (for example, 1.2.3)."
            }

            ./scripts/package-release.ps1 -Version $versionInput -Repository $repository -Clean
          }

      - name: Validate SPDX and winget interoperability
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
        run: |
          python -m pip install --disable-pip-version-check -r .github/quality/sbom-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned metadata validators.' }
          python scripts/validate-release-schemas.py --sbom "artifacts/release/AudioPilot-$env:RELEASE_VERSION-sbom.spdx.json" --winget artifacts/release/winget --self-test
          if ($LASTEXITCODE -ne 0) { throw 'SPDX or winget schema validation failed.' }

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-pilot-release-artifacts
          path: artifacts/release
          compression-level: 0
          if-no-files-found: error

  publish-and-package:
    if: inputs.signed_checksums_sha256 != ''
    concurrency:
      group: application-release-publication
      cancel-in-progress: false
    needs:
      - resolve-release-version
      - release-gate-unit-tests
      - release-gate-integration-tests
      - release-gate-stress-tests
      - publish-profiles
      - build-msi-installers
      - build-upgrade-baselines
      - test-msi-installers
      - prepare-packages
      - verify-signed-release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download prepared release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-signed-release
          path: artifacts/release

      - name: Verify prepared release outputs
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/validate-release-integrity.ps1 -ExpectedCommit $env:RELEASE_COMMIT
          . ./scripts/lib/GitHubRelease.ps1
          $release = Assert-AudioPilotReleaseMutable -Repository $env:RELEASE_REPOSITORY -Version $env:RELEASE_VERSION -RequireDraft -ExpectedCommit $env:RELEASE_COMMIT
          Assert-AudioPilotRemoteReleaseHashes -Release $release -Directory artifacts/release

      - name: Resolve release metadata paths
        id: release-metadata
        shell: pwsh
        run: |
          $sbom = Get-ChildItem -Path "artifacts/release" -Filter "*-sbom.spdx.json" | Select-Object -First 1
          if ($null -eq $sbom) {
            throw "SBOM artifact was not generated."
          }

          "sbom-path=$($sbom.FullName.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: artifacts/release/SHA256SUMS.txt

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: artifacts/release/SHA256SUMS.txt
          predicate-type: https://spdx.dev/Document/v3
          predicate-path: ${{ steps.release-metadata.outputs.sbom-path }}

      - name: Upload verification metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-pilot-release-metadata
          path: |
            artifacts/release/SHA256SUMS.txt
            artifacts/release/release-manifest.json
            artifacts/release/*-sbom.spdx.json
            artifacts/release/*-provenance.json
            artifacts/release/winget/
          if-no-files-found: error
          retention-days: 14

      - name: Generate release body
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ needs.resolve-release-version.outputs.version }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $versionInput = $env:RELEASE_VERSION_INPUT
          if ([string]::IsNullOrWhiteSpace($versionInput) -and $env:RELEASE_REF_TYPE -eq "tag") {
            $versionInput = $env:RELEASE_REF_NAME.TrimStart('v')
          }

          if (-not [string]::IsNullOrWhiteSpace($versionInput) -and $versionInput -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release version must use numeric SemVer core format (for example, 1.2.3)."
          }

          $repository = $env:RELEASE_REPOSITORY
          if ($repository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "Release repository has an invalid owner/name format."
          }

          ./scripts/release-body.ps1 -ChecksumsPath "artifacts/release/SHA256SUMS.txt" -ManifestPath "artifacts/release/release-manifest.json" -Version $versionInput -Repository $repository -OutputPath "artifacts/release-notes.md"

      - name: Publish the verified signed draft without replacing any asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.resolve-release-version.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          . ./scripts/lib/GitHubRelease.ps1
          $release = Assert-AudioPilotReleaseMutable -Repository $env:RELEASE_REPOSITORY -Version $env:RELEASE_VERSION -RequireDraft -ExpectedCommit $env:RELEASE_COMMIT
          Assert-AudioPilotRemoteReleaseHashes -Release $release -Directory artifacts/release
          gh release edit "v$env:RELEASE_VERSION" --repo $env:RELEASE_REPOSITORY --title "AudioPilot - $env:RELEASE_VERSION" --draft=false --latest --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Signed release publication failed.' }
          $published = gh api "repos/$env:RELEASE_REPOSITORY/releases/tags/v$env:RELEASE_VERSION" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft) { throw 'Release publication was not confirmed.' }
          Assert-AudioPilotRemoteReleaseHashes -Release $published -Directory artifacts/release

  refresh-website:
    needs: publish-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Refresh website after verified publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/workflows/website.yml/dispatches" -f ref=main
