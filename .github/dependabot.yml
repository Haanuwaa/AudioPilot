version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/AudioPilot.Updater/TufBridge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/.github/quality"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
